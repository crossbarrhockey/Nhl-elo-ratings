name: Update NHL games

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python scrape_nhl.py
      - name: Commit updated games
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/nhl_games.csv
          git diff --cached --quiet || git commit -m "Update NHL games"
          git push
